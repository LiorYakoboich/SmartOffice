name: SmartOffice CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore AuthService tests
        run: dotnet restore SmartOffice.AuthService.Tests

      - name: Restore AssetService tests
        run: dotnet restore SmartOffice.AssetService.Tests

      - name: Run AuthService tests
        run: >
          dotnet test SmartOffice.AuthService.Tests
          --no-restore
          --configuration Release

      - name: Run AssetService tests
        run: >
          dotnet test SmartOffice.AssetService.Tests
          --no-restore
          --configuration Release

  frontend:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: SmartOffice.Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: SmartOffice.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run

      - name: Build frontend
        run: npm run build